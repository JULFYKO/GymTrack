{% extends 'base.html' %} {% block title %}Login — GymTrack{% endblock %} {%
block content %}
<div class="max-w-md mx-auto mt-20">
  <div class="bg-slate-800 rounded-lg p-6 shadow-lg border border-slate-700">
    <h1 class="text-2xl font-bold text-slate-100 mb-4">Sign in</h1>
    <form method="post" action="">
      {% csrf_token %} {% if form.non_field_errors %}
      <div class="text-red-400 mb-3">{{ form.non_field_errors }}</div>
      {% endif %}

      <label class="block text-sm text-slate-300 mb-1">Username</label>
      <input
        type="text"
        name="username"
        value="{{ form.username.value|default_if_none:'' }}"
        class="w-full mb-3 px-3 py-2 rounded bg-slate-700 text-slate-200 border border-slate-600 focus:outline-none"
        autofocus
      />

      <label class="block text-sm text-slate-300 mb-1">Password</label>
      <input
        type="password"
        name="password"
        class="w-full mb-4 px-3 py-2 rounded bg-slate-700 text-slate-200 border border-slate-600 focus:outline-none"
      />

      {% if next %}
      <input type="hidden" name="next" value="{{ next }}" />
      {% elif request.GET.next %}
      <input type="hidden" name="next" value="{{ request.GET.next }}" />
      {% endif %}

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded"
      >
        Sign in
      </button>
    </form>

    <div class="mt-4 text-sm text-slate-400">
      <a href="{% url 'workouts:exercise-list' %}" class="hover:underline"
        >Back to exercises</a
      >
      <span class="mx-2">·</span>
      <a href="{% url 'register' %}" class="hover:underline">Create account</a>
    </div>
  </div>
</div>
{% endblock %}
