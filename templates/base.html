<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}GymTrack{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <nav class="bg-slate-900 text-white border-b border-slate-800">
      <div class="px-4">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-4">
            <a class="text-xl font-semibold" href="/">GymTrack</a>

            <a
              class="hover:bg-slate-800 px-3 py-2 rounded transition"
              href="/workouts/exercises/"
            >
              Exercises
            </a>
            
            

            <a
              class="hover:bg-slate-800 px-3 py-2 rounded transition"
              href="/training/"
            >
              Training
            </a>

            <a
              class="hover:bg-slate-800 px-3 py-2 rounded transition"
              href="/training/analytics/"
            >
              Analytics
            </a>
          </div>

          <div class="flex items-center space-x-2">
            {% if request.user.is_authenticated %}
            <a class="px-3 py-2 rounded hover:bg-slate-800 transition" href="#">
              {{ request.user.username }}
            </a>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button
                type="submit"
                class="px-3 py-2 rounded hover:bg-slate-800 transition text-red-400 hover:text-red-300"
              >
                Logout
              </button>
            </form>
            {% else %}
            <a
              class="px-3 py-2 rounded hover:bg-slate-800 transition"
              href="/accounts/login/"
            >
              Login
            </a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-6 pb-24">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
