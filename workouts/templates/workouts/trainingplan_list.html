{% extends 'base.html' %} {% block title %}Training Plans — GymTrack{% endblock
%} {% block content %}
<div class="flex justify-between items-center mb-4">
  <h1 class="text-2xl font-semibold text-slate-100">Training Plans</h1>
  <a
    class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded"
    href="/workouts/exercises/"
    >View Exercises</a
  >
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  {% for plan in plans %}
  <div class="bg-slate-800 rounded-lg overflow-hidden shadow p-4">
    <a
      class="text-lg font-semibold text-slate-100 hover:underline"
      href="{% url 'workouts:trainingplan-detail' plan.pk %}"
      >{{ plan.title }}</a
    >
    <div class="mt-2 flex justify-between items-center">
      <div class="text-sm text-slate-300">
        {{ plan.created_at|date:'Y-m-d' }}
      </div>
      <a
        class="text-red-400 hover:text-red-500 text-sm"
        href="{% url 'workouts:trainingplan-delete' plan.pk %}"
        >Delete</a
      >
    </div>
  </div>
  {% empty %}
  <div class="text-slate-400">No plans yet.</div>
  {% endfor %}
</div>

{% endblock %}
