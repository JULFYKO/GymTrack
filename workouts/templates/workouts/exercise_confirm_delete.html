{% extends 'base.html' %} 

{% block title %}Delete Exercise — GymTrack{% endblock %} 

{% block content %}
<div class="flex items-center justify-center min-h-[50vh]">
  <div class="w-full max-w-md bg-slate-800 shadow-xl rounded-xl overflow-hidden border border-slate-700">
    
    <div class="bg-slate-900/50 p-6 border-b border-slate-700">
      <h1 class="text-xl font-bold text-red-400 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        Delete Exercise
      </h1>
    </div>

    <div class="p-6">
      <p class="text-slate-300 text-lg">
        Are you sure you want to delete <strong class="text-white">"{{ object.name }}"</strong>?
      </p>
      <p class="mt-2 text-sm text-slate-500">
        This action cannot be undone.
      </p>

      <form method="post" class="mt-8 flex items-center justify-end gap-3">
        {% csrf_token %}
        
        <a
          class="px-4 py-2 rounded text-slate-400 hover:text-white hover:bg-slate-700 transition"
          href="{% url 'workouts:exercise-list' %}"
        >
          Cancel
        </a>
        
        <button
          class="bg-red-600 hover:bg-red-700 text-white font-medium px-5 py-2 rounded shadow-lg transition transform hover:-translate-y-0.5 focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-slate-800"
          type="submit"
        >
          Yes, Delete it
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
